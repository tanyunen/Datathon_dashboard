<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convert Dashboards to PDF</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #153f32;
      --green: #07583e;
      --muted: #526b61;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f1f5f2;
      color: var(--ink);
      font: 15px/1.45 "Segoe UI", Arial, sans-serif;
    }

    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      max-width: 1500px;
      min-height: 64px;
      margin: 0 auto 16px;
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid #cbded3;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 2px 8px #153f3214;
    }

    .print-toolbar h1 {
      margin: 0;
      color: var(--green);
      font-size: 18px;
    }

    .print-toolbar p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .print-toolbar a,
    .print-toolbar button {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid #cbded3;
      border-radius: 6px;
      background: #fff;
      color: var(--green);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .print-toolbar button {
      border-color: #087a50;
      background: #087a50;
      color: #fff;
    }

    .print-toolbar button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .dashboard-frame {
      display: block;
      width: 100%;
      height: 100vh;
      max-width: 1500px;
      margin: 0 auto 16px;
      border: 0;
      background: #fff;
      box-shadow: 0 2px 8px #153f3214;
    }

    @media (max-width: 600px) {
      .print-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @page {
      size: A3 landscape;
      margin: 4mm;
    }

    @media print {
      html,
      body {
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }

      .print-toolbar {
        display: none !important;
      }

      body > iframe {
        display: block;
        width: 100%;
        height: 100vh;
        margin: 0;
        border: 0;
        break-inside: avoid;
      }

      body > iframe:not(:last-child) {
        break-after: page;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>
  <header class="print-toolbar">
    <div>
      <h1>Convert dashboards to PDF</h1>
      <p id="status">Loading the 13 dashboards. The print dialog will open when they are ready.</p>
    </div>
    <a href="index.html">Back to dashboard hub</a>
    <button id="print-button" type="button" disabled>Convert to PDF</button>
  </header>

  <script>
    const dashboards = [
      ["Dashboard 1: Route participants and duration", "dashboard_1.html"],
      ["Dashboard 2: Transaction type and continuity", "dashboard_3.html"],
      ["Dashboard 3: Path continuity and duration", "dashboard_2.html"],
      ["Dashboard 4: Business vs Consumer payments", "dashboard_4.html"],
      ["Dashboard 5: Party text patterns", "dashboard5.html"],
      ["Dashboard 6: Currency and FX mix", "dashboard6/dashboard6_version2.html"],
      ["Dashboard 7: FX steps and duration", "dashboard7/dashboard7_slide(final).html"],
      ["Dashboard 8: Anomaly labels and payment amounts", "dashboard_8.html"],
      ["Dashboard 9: Anomaly-label rate by currency", "dashboard_9.html"],
      ["Dashboard 10: Payment anomalies by currency and account type", "dashboard_10.html"],
      ["Dashboard 11: Hourly anomaly-label rates", "dashboard_11.html"],
      ["Dashboard 12: Transaction traffic over time", "dashboard11/dashboard_12.html"],
      ["Dashboard 13: Intermediary banks and payment speed", "dashboard_13.html"],
    ];

    const printButton = document.getElementById("print-button");
    const status = document.getElementById("status");
    const shouldPrint = new URLSearchParams(window.location.search).get("print") === "1";
    let loaded = 0;

    dashboards.forEach(([title, source]) => {
      const frame = document.createElement("iframe");
      frame.className = "dashboard-frame";
      frame.title = title;
      frame.addEventListener("load", () => {
        loaded += 1;
        if (loaded !== dashboards.length) return;

        printButton.disabled = false;
        status.textContent = "All dashboards are ready. Choose Save as PDF in the print dialog.";
        if (shouldPrint) window.setTimeout(() => window.print(), 150);
      }, { once: true });
      frame.src = source;
      document.body.append(frame);
    });

    printButton.addEventListener("click", () => window.print());
  </script>
</body>
</html>
